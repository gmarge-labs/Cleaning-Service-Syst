version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/build
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
env:
  variables:
    VITE_API_URL: https://your-ec2-backend-domain.com/api
    VITE_SOCKET_URL: https://your-ec2-backend-domain.com
